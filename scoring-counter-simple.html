<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Scoring Counter</title>
    <style>
      * {
        touch-action: manipulation;
      }
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: linear-gradient(145deg, #2a2a3e, #1f1f33);
        border-radius: 20px;
        padding: 25px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .score-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 30px;
      }

      .score-btn {
        background: linear-gradient(145deg, #4a9eff, #2196f3);
        border: none;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        min-height: 60px;
        box-shadow:
          0 5px 15px rgba(33, 150, 243, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .score-btn:hover {
        background: linear-gradient(145deg, #5ba3ff, #42a5f5);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(33, 150, 243, 0.4);
      }

      .score-btn:active {
        transform: translateY(0);
        background: linear-gradient(145deg, #1976d2, #1565c0);
      }

      .history-section {
        margin-bottom: 30px;
      }

      .history-list {
        background: linear-gradient(145deg, #1e1e2e, #151525);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        min-height: 60px;
        max-height: 150px;
        overflow-y: auto;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .history-item {
        display: inline-block;
        background: linear-gradient(145deg, #3d5afe, #2962ff);
        padding: 8px 15px;
        margin: 3px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        color: white;
        box-shadow: 0 3px 10px rgba(61, 90, 254, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .total-section {
        text-align: center;
        padding: 25px;
        background: linear-gradient(145deg, #673ab7, #512da8);
        color: white;
        border-radius: 20px;
        box-shadow:
          0 8px 25px rgba(103, 58, 183, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .total-score {
        font-size: 42px;
        font-weight: bold;
        text-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
        margin: 15px 0;
      }

      .clear-btn {
        background: linear-gradient(145deg, #f44336, #d32f2f);
        border: none;
        color: white;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .clear-btn:hover {
        background: linear-gradient(145deg, #f55a4e, #e53935);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
      }

      .undo-btn {
        background: linear-gradient(145deg, #ff9800, #f57c00);
        border: none;
        color: white;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .undo-btn:hover {
        background: linear-gradient(145deg, #ffb74d, #fb8c00);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
      }

      .undo-btn:disabled {
        background: linear-gradient(145deg, #555, #444);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
        opacity: 0.6;
      }

      /* Scrollbar styling for webkit browsers */
      .history-list::-webkit-scrollbar {
        width: 8px;
      }

      .history-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      .history-list::-webkit-scrollbar-thumb {
        background: linear-gradient(145deg, #3d5afe, #2962ff);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Score Buttons Row -->
      <div class="score-buttons">
        <button class="score-btn" onclick="addScore(1)">1</button>
        <button class="score-btn" onclick="addScore(2)">2</button>
        <button class="score-btn" onclick="addScore(3)">3</button>
        <button class="score-btn" onclick="addScore(4)">4</button>
        <button class="score-btn" onclick="addScore(5)">5</button>
        <button class="score-btn" onclick="addScore(6)">6</button>
        <button class="score-btn" onclick="addScore(7)">7</button>
        <button class="score-btn" onclick="addScore(8)">8</button>
        <button class="score-btn" onclick="addScore(9)">9</button>
      </div>

      <!-- History Row -->
      <div class="history-section">
        <div class="history-list" id="historyList">
          <!-- History items will be added here -->
        </div>
      </div>

      <!-- Total Score Row -->
      <div class="total-section">
        <button class="undo-btn" id="undoBtn" onclick="undoLastScore()">
          Undo
        </button>
        <div class="total-score" id="totalScore">0</div>
        <button class="clear-btn" onclick="clearHistory()">Reset</button>
      </div>
    </div>

    <script>
      let scoreHistory = [];
      let totalScore = 0;

      // Hardcoded operation - can be changed to subtraction later
      const OPERATION = "add"; // Change to 'subtract' if needed in future

      function addScore(points) {
        // Hardcoded addition operation
        if (OPERATION === "add") {
          totalScore += points;
        } else if (OPERATION === "subtract") {
          // Future implementation for subtraction
          totalScore -= points;
        }

        // Add to history
        scoreHistory.push(points);

        // Update display
        updateDisplay();
      }

      function undoLastScore() {
        if (scoreHistory.length > 0) {
          // Remove last score from history
          const lastScore = scoreHistory.pop();

          // Update total score
          if (OPERATION === "add") {
            totalScore -= lastScore;
          } else if (OPERATION === "subtract") {
            totalScore += lastScore;
          }

          // Update display
          updateDisplay();
        }
      }

      function updateDisplay() {
        // Update total score
        document.getElementById("totalScore").textContent = totalScore;

        // Update history
        const historyList = document.getElementById("historyList");
        historyList.innerHTML = "";

        scoreHistory.forEach((score, index) => {
          const historyItem = document.createElement("span");
          historyItem.className = "history-item";
          historyItem.textContent =
            OPERATION === "add" ? `+${score}` : `-${score}`;
          historyList.appendChild(historyItem);
        });

        if (scoreHistory.length === 0) {
          historyList.textContent = "No scores yet...";
        }

        // Enable/disable undo button based on history
        const undoBtn = document.getElementById("undoBtn");
        undoBtn.disabled = scoreHistory.length === 0;
      }

      function clearHistory() {
        scoreHistory = [];
        totalScore = 0;
        updateDisplay();
      }

      // Initialize display
      updateDisplay();
    </script>
  </body>
</html>
